<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Player Profiles | Daulatpur Champions League</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>
:root{--bg:#07111f;--panel:#101f35;--line:#29415e;--lime:#c7f36b;--muted:#9aacc2;--white:#f5f8fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#173653 0,transparent 42%),var(--bg);color:var(--white);font-family:'DM Sans','Noto Sans Bengali',sans-serif}.wrap{width:min(1120px,calc(100% - 30px));margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:44px}.brand{display:flex;align-items:center;gap:12px;color:white;text-decoration:none}.crest{width:48px;height:48px;border:1px solid var(--lime);border-radius:13px;display:grid;place-items:center;color:var(--lime);font-weight:900}.brand b,.brand small{display:block}.brand b{font:800 20px 'Barlow Condensed';letter-spacing:1px}.brand small{font:600 10px 'Barlow Condensed';letter-spacing:2px;color:var(--muted)}button,select{font:inherit}.lang{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:#10223a;color:white}.hero{margin-bottom:25px}.eyebrow{color:var(--lime);font-size:11px;letter-spacing:2px;font-weight:800}.hero h1{font:900 clamp(38px,7vw,64px)/1 'Barlow Condensed';margin:9px 0}.hero p{color:var(--muted);max-width:650px;line-height:1.7}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.toolbar select,.toolbar input{min-width:220px;flex:1;border:1px solid var(--line);border-radius:10px;background:#0c1b2e;color:white;padding:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:linear-gradient(145deg,#11243d,#0c192d);border:1px solid var(--line);border-radius:16px;padding:17px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);border-color:var(--lime)}.photo{width:76px;height:76px;flex:0 0 76px;border-radius:50%;object-fit:cover;border:1px solid #526b83;background:#1b3552}.name{font-weight:800}.meta{color:var(--muted);font-size:12px;margin-top:4px}.stats{font-size:11px;color:#d7e2ed;margin-top:8px}.number{margin-left:auto;color:var(--lime);font:800 22px 'Barlow Condensed'}.empty{padding:30px;text-align:center;color:var(--muted);grid-column:1/-1}.dialog{width:min(92vw,560px);border:1px solid #385276;border-radius:18px;background:#0b1730;color:white;padding:24px}.dialog::backdrop{background:#020817d9;backdrop-filter:blur(5px)}.close{float:right;border:0;background:transparent;color:white;font-size:27px}.profile{display:flex;gap:18px;align-items:center;margin:20px 0}.profile img{width:112px;height:112px;border-radius:50%;object-fit:cover;border:2px solid var(--lime)}.profile h2{font:800 30px 'Barlow Condensed';margin:0}.profile p{color:var(--muted);margin:6px 0}.profile-num{font:900 34px 'Barlow Condensed';color:var(--lime)}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#132541;border:1px solid #253d60;border-radius:10px;padding:13px;text-align:center}.stat b{display:block;color:var(--lime);font:800 25px 'Barlow Condensed'}.stat small{color:var(--muted);font-size:10px}.footer{text-align:center;color:#71869e;font-size:11px;padding:30px 0 0}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.grid{grid-template-columns:1fr}.card{padding:13px}.photo{width:64px;height:64px;flex-basis:64px}.top{margin-bottom:30px}.brand b{font-size:16px}}
</style></head><body><main class="wrap"><header class="top"><a class="brand" href="index.html"><span class="crest">DCL</span><span><b>DAULATPUR CHAMPIONS LEAGUE</b><small>2026–2027 • OFFICIAL PLAYER PROFILES</small></span></a><button class="lang" id="langBtn">বাংলা</button></header><section class="hero"><div class="eyebrow" id="eyebrow">THE SQUADS</div><h1 id="heading">PLAYER PROFILES</h1><p id="intro">Explore every team squad, player photo, position and tournament statistics.</p></section><div class="toolbar"><select id="teamSelect"><option value="">All teams</option></select><input id="search" type="search" placeholder="Search player name or jersey number"></div><section class="grid" id="playersGrid"><div class="empty">Loading player profiles…</div></section><footer class="footer">Developed by Md Abu Sofian</footer></main><dialog class="dialog" id="profileDialog"><button class="close" id="closeDialog">×</button><div id="profileContent"></div></dialog>
<script>
(()=>{const $=s=>document.querySelector(s);const cfg={url:window.DCL_SUPABASE_URL||window.DAULATPUR_SUPABASE?.url,key:window.DCL_SUPABASE_ANON_KEY||window.DAULATPUR_SUPABASE?.anonKey};const db=cfg.url&&cfg.key&&window.supabase?.createClient?window.supabase.createClient(cfg.url,cfg.key):null;let teams=[],players=[],events=[],lang='en';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const bn=n=>String(n??0).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);const teamName=id=>{const t=teams.find(x=>x.id===id);return t?(lang==='bn'?(t.name_bn||t.name_en):t.name_en):'—'};function stats(p){const ev=events.filter(e=>e.player_id===p.id);return {goals:ev.filter(e=>e.event_type==='goal').length,yellow:ev.filter(e=>e.event_type==='yellow_card').length,red:ev.filter(e=>e.event_type==='red_card').length,apps:Number(p.appearances||0),assists:Number(p.assists||0),motm:Number(p.man_of_the_match||0)}}function render(){const teamId=$('#teamSelect').value,q=$('#search').value.trim().toLowerCase();const list=players.filter(p=>(!teamId||p.team_id===teamId)&&(!q||p.player_name.toLowerCase().includes(q)||String(p.jersey_number??'').includes(q)));$('#playersGrid').innerHTML=list.map(p=>{const st=stats(p);return `<article class="card" tabindex="0" data-id="${esc(p.id)}"><img class="photo" src="${esc(p.photo_url||'https://dummyimage.com/160x160/1b3552/c7f36b&text=DCL')}" alt="${esc(p.player_name)}"><div><div class="name">${esc(p.player_name)}</div><div class="meta">${esc(teamName(p.team_id))} · ${esc(p.position||'Player')}</div><div class="stats">${lang==='en'?'Goals':'গোল'} ${bn(st.goals)} · ${lang==='en'?'Apps':'ম্যাচ'} ${bn(st.apps)}</div></div><span class="number">${p.jersey_number==null?'—':'#'+bn(p.jersey_number)}</span></article>`}).join('')||`<div class="empty">${lang==='en'?'No player profiles found yet.':'এখনো কোনো খেলোয়াড়ের প্রোফাইল পাওয়া যায়নি।'}</div>`;document.querySelectorAll('[data-id]').forEach(el=>{el.onclick=()=>open(el.dataset.id);el.onkeydown=e=>{if(e.key==='Enter')open(el.dataset.id)}})}function open(id){const p=players.find(x=>x.id===id);if(!p)return;const st=stats(p);$('#profileContent').innerHTML=`<div class="eyebrow">DAULATPUR CHAMPIONS LEAGUE · PLAYER</div><div class="profile"><img src="${esc(p.photo_url||'https://dummyimage.com/220x220/1b3552/c7f36b&text=DCL')}" alt="${esc(p.player_name)}"><div><h2>${esc(p.player_name)}</h2><p>${esc(teamName(p.team_id))} · ${esc(p.position||'Player')}</p><div class="profile-num">#${p.jersey_number==null?'—':bn(p.jersey_number)}</div></div></div><div class="stats-grid">${[['apps','MATCHES'],['goals','GOALS'],['assists','ASSISTS'],['yellow','YELLOW CARDS'],['red','RED CARDS'],['motm','MAN OF THE MATCH']].map(([k,l])=>`<div class="stat"><b>${bn(st[k])}</b><small>${l}</small></div>`).join('')}</div>${p.bio?`<p class="meta" style="margin-top:16px">${esc(p.bio)}</p>`:''}`;$('#profileDialog').showModal()}async function init(){if(!db){$('#playersGrid').innerHTML='<div class="empty">Supabase connection is not configured.</div>';return}const [t,p,e]=await Promise.all([db.from('dcl_teams').select('id,name_en,name_bn').eq('is_published',true).order('sort_order'),db.from('dcl_players').select('*').order('player_name'),db.from('dcl_match_events').select('player_id,event_type')]);if(t.error||p.error||e.error){$('#playersGrid').innerHTML=`<div class="empty">${esc((t.error||p.error||e.error).message)}</div>`;return}teams=t.data||[];players=p.data||[];events=e.data||[];$('#teamSelect').innerHTML=`<option value="">${lang==='en'?'All teams':'সব দল'}</option>`+teams.map(t=>`<option value="${esc(t.id)}">${esc(lang==='bn'?(t.name_bn||t.name_en):t.name_en)}</option>`).join('');render()}$('#teamSelect').onchange=render;$('#search').oninput=render;$('#langBtn').onclick=()=>{lang=lang==='en'?'bn':'en';document.documentElement.lang=lang;$('#langBtn').textContent=lang==='en'?'বাংলা':'English';$('#eyebrow').textContent=lang==='en'?'THE SQUADS':'দলীয় স্কোয়াড';$('#heading').textContent=lang==='en'?'PLAYER PROFILES':'খেলোয়াড় প্রোফাইল';$('#intro').textContent=lang==='en'?'Explore every team squad, player photo, position and tournament statistics.':'দলের স্কোয়াড, খেলোয়াড়ের ছবি, পজিশন ও টুর্নামেন্টের পরিসংখ্যান দেখুন।';$('#search').placeholder=lang==='en'?'Search player name or jersey number':'খেলোয়াড়ের নাম বা জার্সি নম্বর খুঁজুন';render()};$('#closeDialog').onclick=()=>$('#profileDialog').close();$('#profileDialog').onclick=e=>{if(e.target===$('#profileDialog'))$('#profileDialog').close()};init()})();
</script></body></html>
